name: build

"on":
  workflow_dispatch:
    inputs:
      bun_ref:
        description: "bun ref (default: versions.json pin — canary commit, see versions.json)"
        required: false
      opencode_ref:
        description: "opencode ref (default: versions.json pin, e.g. v1.4.9)"
        required: false
      opentui_ref:
        description: "opentui ref (default: versions.json pin, e.g. v0.4.5)"
        required: false
      skip_verify:
        description: "Skip the CentOS 7 verification job (build only)"
        type: boolean
        default: false
      tag:
        description: "Release tag (default: oc-<date>-<bun short sha>)"
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.package.outputs.tag }}
      bun_sha: ${{ steps.sync.outputs.bun_sha }}
      opencode_sha: ${{ steps.sync.outputs.opencode_sha }}
      opentui_sha: ${{ steps.sync.outputs.opentui_sha }}
      oc_build_id: ${{ steps.ocid.outputs.oc_build_id }}
      oc_version: ${{ steps.ocid.outputs.oc_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: oc

      - name: Resolve refs
        id: refs
        run: |
          cd oc
          bun_ref="${{ inputs.bun_ref }}"; opencode_ref="${{ inputs.opencode_ref }}"; opentui_ref="${{ inputs.opentui_ref }}"
          [ -n "$bun_ref" ] || bun_ref="$(jq -r .bun.ref versions.json)"
          [ -n "$opencode_ref" ] || opencode_ref="$(jq -r .opencode.ref versions.json)"
          [ -n "$opentui_ref" ] || opentui_ref="$(jq -r .opentui.ref versions.json)"
          echo "bun_ref=$bun_ref" >> "$GITHUB_ENV"
          echo "opencode_ref=$opencode_ref" >> "$GITHUB_ENV"
          echo "opentui_ref=$opentui_ref" >> "$GITHUB_ENV"
          echo "patch_hash=$(sha256sum patches/*.patch | sha256sum | cut -c1-12)" >> "$GITHUB_ENV"
          echo "resolved: bun=$bun_ref opencode=$opencode_ref opentui=$opentui_ref patches=$patch_hash"

      - name: Build docker images
        run: |
          cd oc
          ./scripts/build-images.sh

      - name: Sync upstreams + patch preflight
        id: sync
        run: |
          cd oc
          ./scripts/sync-upstream.sh "$bun_ref" "$opencode_ref" "$opentui_ref"
          echo "bun_sha=$(cat output/upstream/bun.sha)" >> "$GITHUB_OUTPUT"
          echo "opencode_sha=$(cat output/upstream/opencode.sha)" >> "$GITHUB_OUTPUT"
          echo "opentui_sha=$(cat output/upstream/opentui.sha)" >> "$GITHUB_OUTPUT"

      # The oc release identity: a tag, an opencode --version, and a build-id
      # marker baked into the binaries. The marker is computed after sync (the
      # resolved SHAs) and flows into build-bun.sh (oc-version.o) and the
      # package/verify steps; OPENCODE_VERSION bakes the oc version into the
      # opencode binary via build-opencode.sh.
      - name: Compute oc build id
        id: ocid
        run: |
          cd oc
          bun8="$(cut -c1-8 output/upstream/bun.sha)"
          ref_san="$(echo "$opencode_ref" | tr '/:' '-')"
          tag="${{ inputs.tag }}"
          [ -n "$tag" ] || tag="oc-${ref_san}-$(date -u +%Y%m%d)-${bun8}"
          oc_version="${opencode_ref#v}-oc-$(date -u +%Y%m%d)-${bun8}"
          oc_build_id="oc-build:tag=${tag} opencode=${opencode_ref}/$(cat output/upstream/opencode.sha) bun=$(cat output/upstream/bun.sha) opentui=${opentui_ref}/$(cat output/upstream/opentui.sha) patches=${patch_hash}"
          echo "OC_TAG=$tag" >> "$GITHUB_ENV"
          echo "OC_VERSION=$oc_version" >> "$GITHUB_ENV"
          echo "OC_BUILD_ID=$oc_build_id" >> "$GITHUB_ENV"
          echo "oc_build_id=$oc_build_id" >> "$GITHUB_OUTPUT"
          echo "oc_version=$oc_version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag"
          echo "build id: $oc_build_id"

      # Artifact caches are keyed by their exact inputs; the build scripts
      # skip when their artifact is already present and valid, so a cache
      # hit turns a ~22 min build into a ~3 min one.
      - name: Cache opentui artifacts
        uses: actions/cache@v4
        with:
          path: |
            oc/output/opentui
            oc/output/zig-0.15.2
          key: oc-opentui-${{ env.opentui_ref }}-0.15.2

      - name: Cache bun artifact
        uses: actions/cache@v4
        with:
          path: oc/bun/build/release-musl-static
          key: oc-bun-${{ env.bun_ref }}-${{ env.opentui_ref }}-${{ env.patch_hash }}

      - name: Cache opencode artifact
        uses: actions/cache@v4
        with:
          path: oc/opencode/packages/opencode/dist
          key: oc-oc-${{ env.opencode_ref }}-${{ env.bun_ref }}-${{ env.patch_hash }}

      - name: Cache deps (cargo registry, zig cache, opencode node_modules)
        uses: actions/cache@v4
        with:
          path: |
            oc/output/cache/cargo-registry
            oc/output/cache/zig
            oc/output/cache/opencode-node_modules
          key: oc-deps-${{ env.opencode_ref }}-${{ env.bun_ref }}
          restore-keys: |
            oc-deps-${{ env.opencode_ref }}

      - name: Build opentui static lib
        run: |
          cd oc
          ./scripts/build-opentui.sh

      - name: Build bun (static musl + opentui + dl-symtab)
        env:
          OPT_RUN_ARGS: "-v ${{ github.workspace }}/oc/output/cache/cargo-registry:/usr/local/cargo/registry -v ${{ github.workspace }}/oc/output/cache/zig:/root/.cache/zig"
        run: |
          cd oc
          ./scripts/build-bun.sh

      - name: Build opencode standalone
        env:
          OPT_RUN_ARGS: "-v ${{ github.workspace }}/oc/output/cache/opencode-node_modules:/src/opencode/node_modules"
        run: |
          cd oc
          ./scripts/build-opencode.sh

      - name: Package artifacts
        id: package
        run: |
          cd oc
          dist=output/dist
          mkdir -p "$dist"
          cp opencode/packages/opencode/dist/opencode-linux-x64-musl/bin/opencode "$dist/opencode-linux-x64-musl"
          cp bun/build/release-musl-static/bun "$dist/bun-linux-x64-musl-static"
          (cd "$dist" && sha256sum * > sha256sums.txt)
          {
            echo "oc tag:     $OC_TAG"
            echo "oc version: $OC_VERSION"
            echo "oc build:   $OC_BUILD_ID"
            echo "bun:        $(cat output/upstream/bun.sha)"
            echo "opencode:   $(cat output/upstream/opencode.sha)"
            echo "opentui:    $(cat output/upstream/opentui.sha)"
            echo "build date: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > "$dist/versions.txt"
          tag="$OC_TAG"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          ls -la "$dist"

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: oc/output/dist
          retention-days: 90

  verify:
    if: ${{ !inputs.skip_verify }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: oc
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Verify on CentOS 7
        env:
          BUN_BIN: ${{ github.workspace }}/dist/bun-linux-x64-musl-static
          OPENCODE_BIN: ${{ github.workspace }}/dist/opencode-linux-x64-musl
          OC_BUILD_ID: ${{ needs.build.outputs.oc_build_id }}
          OC_VERSION: ${{ needs.build.outputs.oc_version }}
        run: |
          cd oc
          ./scripts/verify-centos7.sh

  release:
    if: ${{ always() && needs.build.result == 'success' && (needs.verify.result == 'success' || needs.verify.result == 'skipped') }}
    needs: [build, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ needs.build.outputs.tag }}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" -y
          fi
          gh release create "$tag" dist/* --repo "$GITHUB_REPOSITORY" --title "$tag" --notes "$(cat dist/versions.txt)"
