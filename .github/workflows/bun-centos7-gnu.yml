name: Bun native CentOS 7 glibc 2.17

on:
  workflow_dispatch:
  push:
    branches: [verify/bun-centos7-glibc217]
    paths:
      - .github/workflows/bun-centos7-gnu.yml
      - docker/Dockerfile.buncentos7
      - scripts/bun-centos7/**
      - tests/bun-centos7/**
      - patches/bun-centos7-*.patch

permissions:
  contents: read

concurrency:
  group: bun-centos7-gnu-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          path: repo
      - uses: actions/checkout@v4
        with:
          repository: oven-sh/bun
          ref: 744846f844374847c902b5e7fd59b4342a51ef99
          path: bun
          submodules: recursive
      - name: Prepare runner and check configuration
        run: |
          bash -n repo/scripts/bun-centos7/*.sh
          python3 -m py_compile repo/scripts/bun-centos7/*.py
          test "$(jq -r .bun.ref repo/versions.json)" = bun-v1.4.2
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet
          mkdir -p cache artifacts/evidence
          git -C repo rev-parse HEAD > artifacts/evidence/repository-commit.txt
          git -C bun rev-parse HEAD > artifacts/evidence/bun-commit.txt
          df -h .
      - uses: docker/setup-buildx-action@v3
      - name: Build native CentOS 7 toolchain image
        uses: docker/build-push-action@v6
        with:
          context: repo
          file: repo/docker/Dockerfile.buncentos7
          load: true
          tags: bun-centos7-gnu:verify
          cache-from: type=gha,scope=bun-centos7-gnu-toolchain
          cache-to: type=gha,mode=max,scope=bun-centos7-gnu-toolchain
      - name: Restore build cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: cache
          key: bun-gnu217-v1-744846f8-${{ hashFiles('repo/docker/Dockerfile.buncentos7', 'repo/scripts/bun-centos7/install-cxx.py') }}-${{ github.run_id }}
          restore-keys: |
            bun-gnu217-v1-744846f8-${{ hashFiles('repo/docker/Dockerfile.buncentos7', 'repo/scripts/bun-centos7/install-cxx.py') }}-
      - name: Compile Bun and external loading fixtures inside CentOS 7
        run: |
          set -o pipefail
          docker run --rm \
            -v "$PWD/repo:/repo:ro" -v "$PWD/bun:/src/bun" \
            -v "$PWD/cache:/cache" -v "$PWD/artifacts:/out" \
            bun-centos7-gnu:verify bash /repo/scripts/bun-centos7/build.sh \
            2>&1 | tee artifacts/evidence/build.log
      - name: Restore runner ownership
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" cache artifacts
      - name: Save incremental progress
        if: always() && steps.cache.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: cache
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - name: Upload build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bun-centos7-glibc217-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14

  verify:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: bun-centos7-glibc217-${{ github.run_id }}
          path: artifacts
      - name: Run in clean CentOS 7 with system glibc and no toolchain
        run: |
          set -o pipefail
          chmod +x artifacts/bun
          docker pull quay.io/centos/centos:7
          docker image inspect quay.io/centos/centos:7 --format '{{json .RepoDigests}}' > runtime-image.txt
          docker run --rm --network none --read-only --tmpfs /tmp:exec \
            -v "$PWD/artifacts:/artifacts:ro" -v "$PWD/scripts/bun-centos7:/tests:ro" \
            quay.io/centos/centos:7 bash /tests/verify.sh 2>&1 | tee runtime.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bun-centos7-runtime-${{ github.run_id }}
          path: |
            runtime.log
            runtime-image.txt
          if-no-files-found: error
